name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    # macOS covers everything in one job: JVM, Android, JS (headless Chrome
    # is preinstalled on the runner) and iOS klib compilation.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # `build` includes `check`: unit tests, ktlintCheck, and the
      # binary-compatibility apiCheck for all modules.
      - name: Build and check all modules
        run: ./gradlew build --stacktrace
