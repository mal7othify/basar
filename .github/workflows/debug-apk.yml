name: Debug APK

# Builds the demo app's debug APK and publishes it as a workflow artifact,
# for installing on a physical device (e.g. M7.12 on-device validation).
# Runs on every push to main and on demand via the Actions tab.
#
# To install: Actions → Debug APK → pick a run → download "basar-debug-apk",
# unzip, and sideload composeApp-debug.apk onto the device.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    # ubuntu is enough here: only the Android target is built
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --stacktrace :composeApp:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: basar-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 14
          if-no-files-found: error
