name: Release

# Publishes the spatial-* artifacts when a version tag is pushed.
# Requires repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — Central Portal token
#   SIGNING_KEY / SIGNING_KEY_PASSWORD — in-memory GPG key (ASCII-armored)
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: >
          ./gradlew publishAndReleaseToMavenCentral
          -PRELEASE_SIGNING_ENABLED=true
          --no-configuration-cache
          --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
