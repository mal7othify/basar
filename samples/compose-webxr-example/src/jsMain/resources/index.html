<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial-KMP WebXR Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 9999;
        }

        #loading h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        #loading p {
            font-size: 1.2em;
            opacity: 0.8;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div id="loading">
    <h1>Spatial-KMP</h1>
    <div class="spinner"></div>
    <p>Loading WebXR Example...</p>
    <p style="font-size: 0.9em; margin-top: 20px;">
        Full Compose Multiplatform + WebXR
    </p>
</div>

<div id="root"></div>

<script src="app.js"></script>

<script>
    // Hide loading screen when app loads
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.opacity = '0';
                loading.style.transition = 'opacity 0.5s';
                setTimeout(() => loading.remove(), 500);
            }
        }, 1000);
    });

    // Log WebXR support
    if ('xr' in navigator) {
        console.log('✅ WebXR API available');
        navigator.xr.isSessionSupported('immersive-ar').then(supported => {
            console.log('AR Support:', supported ? '✅ YES' : '❌ NO');
        });
        navigator.xr.isSessionSupported('immersive-vr').then(supported => {
            console.log('VR Support:', supported ? '✅ YES' : '❌ NO');
        });
    } else {
        console.log('❌ WebXR not available');
    }
</script>
</body>
</html>
